name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (example: v2.1.8)'
        required: true
        type: string

concurrency:
  group: ci-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  js-lua-checks:
    name: JS/TS/Lua Checks (Type & Lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run format:prettier:check
      - run: bun run format:stylua:check
      - run: bun run build:plugin
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build:app

      - name: Install Selene
        run: cargo install selene --version 0.31.0 --locked

      - name: Run Selene
        run: cd plugin && selene .

  rust-check:
    name: Rust Check & Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: bun install --frozen-lockfile
      - run: bun run build:plugin
      - run: bun run rust:check
      - run: bun run rust:lint
      - run: bun run rust:test

  prepare-release:
    name: Prepare Release
    needs: [js-lua-checks, rust-check]
    if: >
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      RELEASE_TAG: ${{ steps.set_tag.outputs.RELEASE_TAG }}
      SHOULD_RELEASE: ${{ steps.check_tag.outputs.SHOULD_RELEASE }}

    steps:
      - uses: actions/checkout@v7

      - name: Get tag from package.json or inputs
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version package.json)
            echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.set_tag.outputs.RELEASE_TAG }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "Release $TAG already exists and this is a push to main. Skipping release build."
              echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
            else
              echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create GitHub Release
    needs: prepare-release
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "TrapSpoofer $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --generate-notes \
              --title "TrapSpoofer $TAG_NAME"
          fi

  build-and-release:
    name: Build & Release (${{ matrix.os }})
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            os: windows
            bundles: nsis
            args: ''

          - platform: macos-latest
            os: macos
            bundles: dmg
            args: '--target universal-apple-darwin'

          - platform: ubuntu-22.04
            os: linux
            bundles: appimage
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os }}

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Normalize Tauri signing key
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const normalizeNewlines = (value) =>
            value.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const rawKey = normalizeNewlines(
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY || ''
          );

          if (!rawKey) {
            fail(
              'Missing GitHub secret TAURI_PRIVATE_KEY. Set it to the full Tauri updater private key.'
            );
          }

          const decodedKey = rawKey.startsWith('untrusted comment:')
            ? rawKey
            : normalizeNewlines(
                Buffer.from(rawKey, 'base64').toString('utf8')
              );

          const keyForTauri = rawKey.startsWith('untrusted comment:')
            ? Buffer.from(`${decodedKey}\n`, 'utf8').toString('base64')
            : rawKey;

          const keyLines = decodedKey.split('\n').filter(Boolean);

          if (
            !keyLines[0]?.startsWith('untrusted comment:') ||
            keyLines.length < 2
          ) {
            fail(
              'TAURI_PRIVATE_KEY must be the full base64 private key generated by "tauri signer generate". A raw full key with the first "untrusted comment:" line is also accepted.'
            );
          }

          if (
            !/secret key/i.test(keyLines[0]) ||
            /public key/i.test(keyLines[0])
          ) {
            fail(
              'TAURI_PRIVATE_KEY contains a public key. Use the generated private key instead.'
            );
          }

          if (!/^[A-Za-z0-9+/=]+$/.test(keyLines[1])) {
            fail(
              'TAURI_PRIVATE_KEY does not look like a valid Tauri/minisign private key.'
            );
          }

          const password =
            process.env.RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '';

          const keyDelimiter =
            `TAURI_SIGNING_KEY_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          const passwordDelimiter =
            `TAURI_SIGNING_PASSWORD_${Date.now()}_${Math.random()
              .toString(36)
              .slice(2)}`;

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            [
              `TAURI_SIGNING_PRIVATE_KEY<<${keyDelimiter}`,
              keyForTauri,
              keyDelimiter,
              `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<${passwordDelimiter}`,
              password,
              passwordDelimiter,
              '',
            ].join('\n')
          );
          NODE

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}
          tagName: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  verify-updater-release:
    name: Verify updater artifacts
    needs: [prepare-release, build-and-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Verify release updater metadata and macOS signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir updater-check

          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir updater-check \
            --pattern latest.json

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            --jq '.assets[].name' \
            > updater-check/assets.txt

          grep -Eq '\.app\.tar\.gz$' updater-check/assets.txt
          grep -Eq '\.app\.tar\.gz\.sig$' updater-check/assets.txt

          node <<'NODE'
          const fs = require('node:fs');

          const latest = JSON.parse(
            fs.readFileSync('updater-check/latest.json', 'utf8')
          );

          const platforms = latest.platforms || {};

          for (const key of ['darwin-aarch64', 'darwin-x86_64']) {
            const value = platforms[key];
            if (!value) {
              throw new Error(`latest.json is missing required macOS updater target ${key}`);
            }
            if (typeof value.signature !== 'string' || value.signature.trim() === '') {
              throw new Error(`latest.json macOS entry ${key} has no updater signature`);
            }
            if (typeof value.url !== 'string' || !value.url.includes('.app.tar.gz')) {
              throw new Error(
                `latest.json macOS entry ${key} does not target an .app.tar.gz updater bundle`
              );
            }
          }
          NODE

  plugin-release:
    name: Build & Release Plugin
    needs: [prepare-release, create-release]
    if: needs.prepare-release.outputs.SHOULD_RELEASE == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Cache bun modules
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build plugin
        run: bun run build:plugin

      - name: Upload plugin to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.RELEASE_TAG }}
          files: dist-plugin/TrapSpoofer.rbxmx
          fail_on_unmatched_files: true
